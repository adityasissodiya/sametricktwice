# The series narrator, frozen for every episode (chosen 2026-10-07 after `vid audition 001`).
# vid preview / align / final use it unless you pass --voice. Do not change these values
# without the creator's approval: a new speaker, speed, pause or model changes the voice
# viewers know. Fix how a name sounds in pronounce.toml instead.

voice = "kokoro"
speaker = "af_heart"
speed = 1.0
# kokoro-onnx adds these two pauses only where it joins text batches (about 500 phonemes
# each). Every beat fits in one batch, so inside a beat the pauses are the model's own
# (measured: a median of 0.50-0.52 s between sentences). They stay here as part of the
# frozen settings and of the cache key. See RESEARCH.md, "Narration and language".
sentence_pause = 0.25  # seconds after . ! ? at a batch join
clause_pause = 0.1     # seconds after , ; : at a batch join

# Kokoro-82M v1.0 (Apache-2.0), checked on every load so the voice cannot drift.
model = "kokoro-v1.0.onnx"
model_sha256 = "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5"
voices = "voices-v1.0.bin"
voices_sha256 = "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"
